<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6e6b">
<title>Morfologia de Grec II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f2efe7; --surface:#fdfcf9; --raise:#eae6db;
  --ink:#1e252b; --dim:#69747d; --line:#d9d3c6;
  --acc:#2c6e6b; --acc-s:#3c8e8a; --acc-w:#e2ecea;
  --ok:#2c6a46; --ok-bg:#e4f0e8; --ko:#a33a2e; --ko-bg:#f8e8e4;
  --bronze:#8f6428; --gr:#17303a;
  --sh:0 1px 2px rgba(30,37,43,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181b; --surface:#1c2227; --raise:#242c32;
  --ink:#e7ebe9; --dim:#98a3a9; --line:#2f393f;
  --acc:#6fb9b2; --acc-s:#8fd0c9; --acc-w:#1d3634;
  --ok:#79cfa0; --ok-bg:#16301f; --ko:#f0968a; --ko-bg:#361c19;
  --bronze:#d3a866; --gr:#dfe9ea;
  --sh:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#14181b; --surface:#1c2227; --raise:#242c32;
  --ink:#e7ebe9; --dim:#98a3a9; --line:#2f393f;
  --acc:#6fb9b2; --acc-s:#8fd0c9; --acc-w:#1d3634;
  --ok:#79cfa0; --ok-bg:#16301f; --ko:#f0968a; --ko-bg:#361c19;
  --bronze:#d3a866; --gr:#dfe9ea;
  --sh:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
 font:16px/1.55 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 -webkit-text-size-adjust:100%;}
.gr,.gform,.lemma,.kbk,table.par td,#inp,.sn em{font-family:"Gentium Plus","Gentium Book Plus",
 "GFS Didot","Palatino Linotype",Palatino,"Times New Roman",serif;}
:focus-visible{outline:2px solid var(--acc-s);outline-offset:2px}
header{background:var(--acc);color:#fff;padding:11px 14px;display:flex;align-items:center;
 gap:8px;position:sticky;top:0;z-index:30;padding-top:max(11px,env(safe-area-inset-top))}
header h1{font-size:16.5px;margin:0;font-weight:600;flex:1;letter-spacing:.15px;white-space:nowrap}
.h2s{font-weight:400;opacity:.72;font-size:13.5px;margin-left:6px;letter-spacing:.4px}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.22);
 border-radius:8px;padding:6px 11px;font:inherit;font-size:13.5px;cursor:pointer}
header button:hover{background:rgba(255,255,255,.26)}
@media(max-width:400px){header h1{font-size:15px}.h2s{display:none}header button{padding:6px 9px;font-size:13px}}
main{max-width:780px;margin:0 auto;padding:16px 12px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;
 margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim);
 margin:0 0 10px;font-weight:600}
h3{font-size:13px;color:var(--acc);margin:18px 0 6px;letter-spacing:.3px;
 text-transform:uppercase;font-weight:600}
.grp{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden;
 background:var(--surface)}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
 background:var(--raise);padding:9px 12px;font-weight:600;font-size:13.5px;letter-spacing:.2px}
.grp-b{display:flex;align-items:center;gap:6px}
.cnt{color:var(--dim);font-weight:400;font-size:12px;min-width:34px;text-align:right;
 font-variant-numeric:tabular-nums}
.mini{background:transparent;border:1px solid var(--line);color:var(--acc);border-radius:7px;
 padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.mini:hover{background:var(--acc-w)}
.secs{padding:4px;display:flex;flex-direction:column}
.sec{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer}
.sec:hover{background:var(--acc-w)}
.sec.on{background:var(--acc-w)}
.sec input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--acc);flex:none}
.sn{font-size:14.5px;line-height:1.35}
.sn em{display:block;font-style:normal;color:var(--dim);font-size:14px;margin-top:1px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;
 padding:6px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.pill:hover{border-color:var(--acc);color:var(--acc)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sub{color:var(--dim);font-size:13.5px;margin:2px 0 12px}
button.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;
 font:inherit;font-size:16px;font-weight:600;cursor:pointer}
button.primary:hover{background:var(--acc-s)}
button.primary:disabled{opacity:.4;cursor:default;background:var(--acc)}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
 border-radius:10px;padding:12px 16px;font:inherit;font-size:15px;cursor:pointer}
button.ghost:hover{border-color:var(--acc);color:var(--acc)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
#count{color:var(--dim);font-size:13.5px;margin-top:12px;font-variant-numeric:tabular-nums}
#bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
#bar span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--raise);
 color:var(--dim);font-variant-numeric:tabular-nums}
#bar .ok{color:var(--ok);background:var(--ok-bg);font-weight:600}
#bar .ko{color:var(--ko);background:var(--ko-bg);font-weight:600}
.qlabel{font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim);
 margin-bottom:10px;font-weight:600}
.gform{font-size:42px;line-height:1.22;text-align:center;color:var(--gr);margin:10px 0 22px;
 word-break:break-word;letter-spacing:.5px}
.lemma{font-size:24px;text-align:center;color:var(--gr);margin:6px 0 2px;word-break:break-word;
 line-height:1.35}
.lemma em{display:block;font-style:italic;font-size:14.5px;color:var(--dim);
 font-family:"IBM Plex Sans",sans-serif;margin-top:5px}
.ask{text-align:center;font-size:16.5px;font-weight:600;margin:16px 0 14px;color:var(--acc)}
.row{margin-bottom:12px}
.rn{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px;
 font-weight:600}
.rb{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;
 padding:9px 13px;font:inherit;font-size:14.5px;cursor:pointer;flex:1 1 auto;min-width:86px}
.opt:hover{border-color:var(--acc);color:var(--acc)}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.inwrap{display:flex;gap:8px;align-items:center}
#inp{flex:1;font-size:28px;padding:11px 14px;border:2px solid var(--line);border-radius:11px;
 background:var(--paper);color:var(--gr);text-align:center;min-width:0}
#inp::placeholder{color:var(--dim);opacity:.6;font-size:19px}
#inp:focus{outline:none;border-color:var(--acc)}
.kbt{background:var(--raise);border:1px solid var(--line);color:var(--acc);border-radius:10px;
 padding:11px 13px;font-size:19px;cursor:pointer;flex:none;line-height:1}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px;text-align:center}
.fb{font-weight:600;font-size:15.5px;padding:10px 14px;border-radius:10px;margin-top:18px;
 letter-spacing:.2px}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--ko-bg);color:var(--ko)}
.line{margin-top:10px;font-size:15px}
.line .gr{font-size:19px;color:var(--gr)}
.note{color:var(--dim);font-size:13.5px}
.warn{color:var(--bronze);font-size:14px;margin-top:12px}
.tblwrap{overflow-x:auto;margin-top:12px}
table.par{border-collapse:collapse;font-size:16px;width:100%}
table.par td,table.par th{border:1px solid var(--line);padding:6px 10px;text-align:left;
 white-space:nowrap;color:var(--gr)}
table.par th{background:var(--raise);font-size:11px;color:var(--dim);font-weight:600;
 font-family:"IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.7px}
table.par td.hi{background:var(--ok-bg);font-weight:700}
button.link{background:none;border:0;color:var(--acc);font:inherit;font-size:13.5px;cursor:pointer;
 padding:6px 0;text-decoration:underline;text-underline-offset:3px}
#kb{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
 border-top:1px solid var(--line);
 padding:7px 6px calc(7px + env(safe-area-inset-bottom));transform:translateY(105%);
 transition:transform .18s ease;z-index:50;box-shadow:0 -6px 22px rgba(0,0,0,.14)}
#kb.open{transform:translateY(0)}
body.kbon main{padding-bottom:240px}
.kbr{display:flex;gap:5px;margin-bottom:5px}
.kbk{flex:1;min-width:0;padding:13px 2px;font-size:22px;border:1px solid var(--line);
 background:var(--paper);color:var(--gr);border-radius:8px;cursor:pointer;line-height:1.1}
.kbk:active{background:var(--acc-w)}
.kbk.wide{flex:1.7;font-size:16px}
.kbk.iota{font-size:19px;letter-spacing:2px}
.kbk.del{color:var(--ko)}
.kbk.close{color:var(--dim)}
.stt{width:100%;border-collapse:collapse;font-size:14px}
.stt td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right;color:var(--dim);white-space:nowrap;font-size:13px;
 font-variant-numeric:tabular-nums}
.barc{width:92px}
.barc span{display:block;height:7px;border-radius:4px;background:var(--acc)}
.barc .g{background:var(--ok)}.barc .y{background:var(--bronze)}.barc .r{background:var(--ko)}
.tot{font-size:14.5px;background:var(--raise);padding:11px 13px;border-radius:10px;line-height:1.6}
footer{color:var(--dim);font-size:12.5px;text-align:center;padding:6px 12px 22px;max-width:780px;
 margin:0 auto;line-height:1.6}
@media(min-width:620px){ .gform{font-size:52px} .opt{flex:0 0 auto} }
@media (prefers-reduced-motion: reduce){ #kb{transition:none} *{scroll-behavior:auto} }
</style>

<body>
<header>
  <h1>Morfologia grega <span class="h2s">Grec II</span></h1>
  <button id="navhome">Continguts</button>
  <button id="navstats">Progrés</button>
</header>

<main>
  <section id="home">
    <div class="card">
      <h2>Tipus d'exercici</h2>
      <div class="pills">
        <button class="pill" data-exmode="analyze">Analitzar formes</button>
        <button class="pill" data-exmode="write">Escriure formes</button>
        <button class="pill" data-exmode="mix">Els dos, barrejats</button>
      </div>
      <h2 style="margin-top:16px">Modes verbals</h2>
      <div class="pills">
        <button class="pill" id="fm_ind">Indicatiu</button>
        <button class="pill" id="fm_subj">Subjuntiu</button>
        <button class="pill" id="fm_opt">Optatiu</button>
        <button class="pill" id="fm_imper">Imperatiu</button>
        <button class="pill" id="fm_inf">Infinitiu</button>
        <button class="pill" id="fm_ptc">Participi</button>
      </div>
      <h2 style="margin-top:16px">Veus</h2>
      <div class="pills">
        <button class="pill" id="fv_act">Activa</button>
        <button class="pill" id="fv_mid">Mitjana</button>
        <button class="pill" id="fv_pass">Passiva</button>
      </div>
    </div>
    <div class="card">
      <h2>Què vols practicar</h2>
      <p class="sub">Tria tots els apartats que vulgues: les preguntes es reparteixen entre ells.</p>
      <div id="seclist"></div>
      <div id="count"></div>
      <div class="acts"><button id="start" class="primary">Comença</button></div>
    </div>
  </section>

  <section id="quiz" style="display:none">
    <div id="bar"></div>
    <div class="card" id="card"></div>
    <div class="acts"><button id="stop" class="ghost">Acabar</button></div>
  </section>

  <section id="stats" style="display:none">
    <div class="card">
      <h2>El teu progrés</h2>
      <div id="statsbody"></div>
      <div class="acts"><button id="reset" class="ghost">Esborrar el progrés</button></div>
    </div>
  </section>
</main>

<div id="kb"></div>

<footer>Els exercicis no s'acaben mai: pots parar quan vulgues.<br>
El progrés es guarda només en aquest navegador.</footer>

<script>
/* ==== 00_accent.js ==== */
/* ============================================================
   00_accent.js  —  Sil·labació, quantitats i accentuació grega
   ============================================================ */
var ACUTE='́', GRAVE='̀', CIRC='͂', SMOOTH='̓',
    ROUGH='̔', DIAER='̈', IOTA='ͅ';
var COMB = /[̀-ͯͅ]/;
var VOW = 'αεηιουω';
function lc(c){ return c.toLowerCase(); }
var DIPHS = {'αι':1,'αυ':1,'ει':1,'ευ':1,'ηυ':1,
             'οι':1,'ου':1,'ωυ':1};

function nfd(s){ return s.normalize('NFD'); }
function nfc(s){ return s.normalize('NFC'); }

function letters(s){
  var out=[], i;
  for (i=0;i<s.length;i++){
    var ch=s[i];
    if (COMB.test(ch) && out.length) out[out.length-1]+=ch;
    else out.push(ch);
  }
  return out;
}
function baseOf(L){ return lc(L[0]); }
function isVowel(L){ return VOW.indexOf(baseOf(L))>=0; }
function hasIota(L){ return L.indexOf(IOTA)>=0; }
function hasBreath(L){ return L.indexOf(SMOOTH)>=0 || L.indexOf(ROUGH)>=0; }
function hasAcc(L){ return L.indexOf(ACUTE)>=0||L.indexOf(GRAVE)>=0||L.indexOf(CIRC)>=0; }

function nuclei(L){
  var res=[], i;
  for(i=0;i<L.length;i++){
    if(!isVowel(L[i])) continue;
    if(i+1<L.length && isVowel(L[i+1])){
      var pair = baseOf(L[i])+baseOf(L[i+1]);
      if(DIPHS[pair] && !hasIota(L[i]) && !hasBreath(L[i]) && !hasAcc(L[i])
         && L[i+1].indexOf(DIAER)<0){
        res.push({a:i,b:i+1,txt:pair}); i++; continue;
      }
    }
    res.push({a:i,b:i,txt:baseOf(L[i]), iota:hasIota(L[i])});
  }
  return res;
}

function natQ(n){
  if(n.iota) return 'L';
  if(n.txt.length===2) return 'L';
  if('ηω'.indexOf(n.txt)>=0) return 'L';
  if('εο'.indexOf(n.txt)>=0) return 'S';
  return '?';
}

function stripAccent(s){
  return nfc(nfd(s).replace(/[́̀͂]/g,''));
}
/* Normalitza per a comparar amb el que escriu l'alumne:
   lleva accents i esperits, conserva la iota subscrita, unifica sigma */
function bare(s){
  var d = nfd(s).replace(/[̀-̈́͆-ͯ]/g,'');
  d = nfc(d).replace(/ς/g,'σ');
  return d.toLowerCase();
}

function putAccent(word, pos, mark){
  var L = letters(nfd(word));
  var ns = nuclei(L);
  if(!ns.length) return nfc(L.join(''));
  var idx = ns.length - pos;
  if(idx<0) idx=0;
  var n = ns[idx];
  var target = n.b;
  if(hasIota(L[target]) && n.a!==n.b) target = n.a;
  var ch = L[target];
  var b = ch[0], m = ch.slice(1);
  var iota = m.indexOf(IOTA)>=0 ? IOTA : '';
  m = m.replace(new RegExp('['+ACUTE+GRAVE+CIRC+IOTA+']','g'),'');
  L[target] = b + m + (mark==='C'?CIRC:ACUTE) + iota;
  return nfc(L.join(''));
}

function resolveAccent(sylls, s, m, uq, pq){
  if(s===0) return {pos:1, mark:m||'A'};
  var pos = sylls - s + 1;
  if(pos<1) pos=1;
  if(pos>3) pos=3;
  if(pos===3){
    if(uq==='L') pos=2;
    else return {pos:3, mark:'A'};
  }
  if(pos===2){
    if(uq==='L') return {pos:2, mark:'A'};
    return {pos:2, mark:(pq==='L'?'C':'A')};
  }
  return {pos:1, mark:m||'A'};
}

function recessive(sylls, uq, pq){
  if(sylls>=3 && uq==='S') return {pos:3, mark:'A'};
  if(sylls>=2){
    if(uq==='L') return {pos:2, mark:'A'};
    return {pos:2, mark:(pq==='L'?'C':'A')};
  }
  return {pos:1, mark:(uq==='L'?'C':'A')};
}

function readAccent(word){
  var L = letters(nfd(word)), ns = nuclei(L), i;
  for(i=0;i<ns.length;i++){
    var a=ns[i].a, b=ns[i].b;
    var chunk = L[a]+(b!==a?L[b]:'');
    if(chunk.indexOf(CIRC)>=0) return {s:i+1, m:'C', pos:ns.length-i};
    if(chunk.indexOf(ACUTE)>=0||chunk.indexOf(GRAVE)>=0) return {s:i+1, m:'A', pos:ns.length-i};
  }
  return {s:1, m:'A', pos:ns.length};
}
function nSyl(word){ return nuclei(letters(nfd(word))).length; }
/* quantitat natural de la síl·laba i-èsima des del final (1 = última) */
function qOf(word, fromEnd){
  var L=letters(nfd(word)), ns=nuclei(L);
  var i = ns.length-fromEnd;
  if(i<0||i>=ns.length) return 'S';
  return natQ(ns[i]);
}

/* ==== 10_nominal.js ==== */
/* ============================================================
   10_nominal.js — Declinació de substantius i adjectius
   ============================================================ */
var CASES = ['nom','voc','ac','gen','dat'];
var NUMS  = ['sg','pl'];
var CASE_CA = {nom:'nominatiu', voc:'vocatiu', ac:'acusatiu', gen:'genitiu', dat:'datiu'};
var NUM_CA  = {sg:'singular', pl:'plural'};
var GEN_CA  = {m:'masculí', f:'femení', n:'neutre'};

/* Desinència: [text, quantitat última, flags]
   flags: C1 = circumflex forçat a l'última
          A1 = agut forçat a l'última
          oxy = si la paraula és oxítona -> circumflex (gen/dat 1a-2a)
          mono = si el tema és monosíl·lab -> accent a la desinència
          gpl = genitiu plural de 1a declinació (circumflex sempre)
          sh  = compta com a breu per a l'accent encara que siga llarga (-εως, -εων) */
function E(t,q,f){ return {t:t, q:q||'S', f:f||''}; }

var ENDINGS = {};

/* ---------- 1a declinació ---------- */
ENDINGS.a_pura = { nom_sg:E('α','L'), voc_sg:E('α','L'), ac_sg:E('αν','L'),
  gen_sg:E('ας','L','oxy'), dat_sg:E('ᾳ','L','oxy'),
  nom_pl:E('αι','S'), voc_pl:E('αι','S'), ac_pl:E('ας','L'),
  gen_pl:E('ων','L','gpl oxy'), dat_pl:E('αις','L','oxy') };
ENDINGS.a_impura = { nom_sg:E('α','S'), voc_sg:E('α','S'), ac_sg:E('αν','S'),
  gen_sg:E('ης','L','oxy'), dat_sg:E('ῃ','L','oxy'),
  nom_pl:E('αι','S'), voc_pl:E('αι','S'), ac_pl:E('ας','L'),
  gen_pl:E('ων','L','gpl oxy'), dat_pl:E('αις','L','oxy') };
ENDINGS.eta = { nom_sg:E('η','L'), voc_sg:E('η','L'), ac_sg:E('ην','L'),
  gen_sg:E('ης','L','oxy'), dat_sg:E('ῃ','L','oxy'),
  nom_pl:E('αι','S'), voc_pl:E('αι','S'), ac_pl:E('ας','L'),
  gen_pl:E('ων','L','gpl oxy'), dat_pl:E('αις','L','oxy') };
ENDINGS.hs = { nom_sg:E('ης','L'), voc_sg:E('α','S'), ac_sg:E('ην','L'),
  gen_sg:E('ου','L','oxy'), dat_sg:E('ῃ','L','oxy'),
  nom_pl:E('αι','S'), voc_pl:E('αι','S'), ac_pl:E('ας','L'),
  gen_pl:E('ων','L','gpl oxy'), dat_pl:E('αις','L','oxy') };
ENDINGS.as = { nom_sg:E('ας','L'), voc_sg:E('α','L'), ac_sg:E('αν','L'),
  gen_sg:E('ου','L','oxy'), dat_sg:E('ᾳ','L','oxy'),
  nom_pl:E('αι','S'), voc_pl:E('αι','S'), ac_pl:E('ας','L'),
  gen_pl:E('ων','L','gpl oxy'), dat_pl:E('αις','L','oxy') };

/* ---------- 2a declinació ---------- */
ENDINGS.o = { nom_sg:E('ος','S'), voc_sg:E('ε','S'), ac_sg:E('ον','S'),
  gen_sg:E('ου','L','oxy'), dat_sg:E('ῳ','L','oxy'),
  nom_pl:E('οι','S'), voc_pl:E('οι','S'), ac_pl:E('ους','L'),
  gen_pl:E('ων','L','oxy'), dat_pl:E('οις','L','oxy') };
ENDINGS.on = { nom_sg:E('ον','S'), voc_sg:E('ον','S'), ac_sg:E('ον','S'),
  gen_sg:E('ου','L','oxy'), dat_sg:E('ῳ','L','oxy'),
  nom_pl:E('α','S'), voc_pl:E('α','S'), ac_pl:E('α','S'),
  gen_pl:E('ων','L','oxy'), dat_pl:E('οις','L','oxy') };

/* ---------- 3a declinació: desinències comunes ---------- */
var E3 = { ac_sg:E('α','S'), gen_sg:E('ος','S','mono'), dat_sg:E('ι','S','mono'),
  nom_pl:E('ες','S'), voc_pl:E('ες','S'), ac_pl:E('ας','S'),
  gen_pl:E('ων','L','mono'), dat_pl:E('σι','S','mono') };
var E3n = { gen_sg:E('ος','S','mono'), dat_sg:E('ι','S','mono'),
  nom_pl:E('α','S'), voc_pl:E('α','S'), ac_pl:E('α','S'),
  gen_pl:E('ων','L','mono'), dat_pl:E('σι','S','mono') };

/* ---------------- Utillatge ---------------- */
function unacc(s){ return stripAccent(s); }

/* Quantitat de la penúltima síl·laba d'una forma composta stem+ending */
function penultQ(w, stem, endSyls){
  /* si la desinència té més d'una síl·laba, la penúltima ix de la desinència */
  var ns = nuclei(letters(nfd(stem)));
  if(endSyls>=2) return null; /* el cridant ho resol */
  var last = ns.length-1;
  if(last<0) return 'S';
  if(w && w.qs && w.qs[last]) return w.qs[last];
  var q = natQ(ns[last]);
  if(q==='?'){
    if(w && w.q && w.q[last]) return w.q[last];
    return 'S';
  }
  return q;
}

/* Construeix la forma stem+ending amb accent */
function build(w, stem, end){
  var txt = stem + end.t;
  var ns  = nuclei(letters(nfd(txt)));
  var endN = nuclei(letters(nfd(end.t))).length;
  var uq = end.q;
  if(end.f.indexOf('sh')>=0) uq='S';
  var pq;
  if(endN>=2){
    var i = ns.length-2;
    pq = i>=0 ? natQ(ns[i]) : 'S';
    if(pq==='?') pq='S';
  } else {
    pq = penultQ(w, stem, 1);
  }
  var r;
  if(end.f.indexOf('C1')>=0) r={pos:1,mark:'C'};
  else if(end.f.indexOf('A1')>=0) r={pos:1,mark:'A'};
  else if(end.f.indexOf('gpl')>=0 && !w.adjFem) r={pos:1,mark:'C'};
  else if(end.f.indexOf('oxy')>=0 && w.acc.s===0) r={pos:1,mark:'C'};
  else if(end.f.indexOf('mono')>=0 && w.mono) r={pos:1,mark:(end.q==='L'?'C':'A')};
  else if(w.acc.s===0) r={pos:1,mark:'A'};
  else if(w.rec) r=recessive(ns.length, uq, pq);
  else r=resolveAccent(ns.length, w.acc.s, w.acc.m, uq, pq);
  return putAccent(txt, r.pos, r.mark);
}

/* Datiu plural de la 3a: sandhi del tema amb -σι */
function datPl3(stem, kind){
  var s = stem;
  if(kind==='vel') return s.replace(/[κγχ]$/,'ξ')+'ι';
  if(kind==='lab') return s.replace(/[πβφ]$/,'ψ')+'ι';
  if(kind==='dent'||kind==='dentN') return s.replace(/[τδθ]$/,'')+'σι';
  if(kind==='nt'){
    var b = s.replace(/ντ$/,'');
    b = b.replace(/ο$/,'ου').replace(/α$/,'α').replace(/ε$/,'ει');
    return b+'σι';
  }
  if(kind==='n') return s.replace(/ν$/,'')+'σι';
  if(kind==='r') return s+'σι';
  return s+'σι';
}

/* ---------------- Constructor de substantius ---------------- */
var GEN_STRIP = {a_pura:2,a_impura:2,eta:2,hs:2,as:2,o:2,on:2,
  vel:2,lab:2,dent:2,dentN:2,nt:2,n:2,r:2,us:2,uN:3,i:3,u:3,eus:3,sN:0,sM:0};

function mkNoun(sp){
  var w = {kind:'noun', l:sp.l, gl:sp.g, art:sp.a, tr:sp.t, type:sp.d,
           gender:sp.gn||(sp.a==='ὁ'?'m':(sp.a==='ἡ'?'f':(sp.a==='τό'?'n':'m'))),
           tags:sp.tg||[], q:{}, mono:!!sp.mono, forms:sp.forms||null};
  if(sp.a==='ὁ, ἡ') w.gender='mf';
  var a = readAccent(sp.l);
  var D12 = ['a_pura','a_impura','eta','hs','as','o','on'];
  var isOxy = (a.pos===1) && D12.indexOf(sp.d)>=0;
  w.acc = {s: isOxy?0:a.s, m:a.m};
  /* quantitats inferides del lema */
  var ns = nuclei(letters(nfd(sp.l)));
  if(a.m==='C') w.q[a.s-1]='L';
  else if(a.pos===2){
    var uq = natQ(ns[ns.length-1]);
    if(uq==='S') w.q[a.s-1]='S';
  }
  if(sp.q) for(var k in sp.q) w.q[k-0]=sp.q[k];
  /* tema */
  var g = unacc(sp.g||'');
  var strip = GEN_STRIP[sp.d];
  if(sp.stem!=null) w.stem = sp.stem;
  else if(sp.d==='sN'||sp.d==='sM') w.stem = g.replace(/ους$/,'');
  else if(strip) w.stem = g.slice(0, g.length-strip);
  else w.stem = g;
  if(sp.d==='eus') w.stem = w.stem+'ε';
  w.nomsg = sp.l;
  w.spec = sp;
  return w;
}

/* declina: torna {nom_sg:'...', ...} */
function declineNoun(w){
  var sp = w.spec, out = {};
  if(w.forms) return w.forms;
  var d = w.type, st = w.stem;
  function set(k,v){ out[k]=v; }
  function fromEnd(tbl,keys){
    keys.forEach(function(k){ if(tbl[k]) set(k, build(w, st, tbl[k])); });
  }
  if(['a_pura','a_impura','eta','hs','as','o','on'].indexOf(d)>=0){
    fromEnd(ENDINGS[d], Object.keys(ENDINGS[d]));
    out.nom_sg = w.nomsg;
  } else {
    /* 3a declinació */
    var neut = (w.gender==='n');
    var tbl = neut?E3n:E3;
    fromEnd(tbl, Object.keys(tbl));
    out.nom_sg = w.nomsg;
    if(neut){ out.voc_sg = w.nomsg; out.ac_sg = w.nomsg; }
    else { out.voc_sg = sp.v || w.nomsg; }
    /* datiu plural amb sandhi */
    var dp = datPl3(st, d);
    out.dat_pl = build(w, dp.slice(0,dp.length-2), E(dp.slice(-2),'S','mono'));
    if(d==='nt'&&!neut){ /* ok */ }
    if(d==='dentN'){ /* σῶμα: nom = tema sense τ */ }
    if(d==='us'){ out.ac_sg = build(w, st, E('ν','S')); }
    if(d==='i'){
      out.ac_sg  = build(w, st, E('ιν','S'));
      out.voc_sg = build(w, st, E('ι','S'));
      out.gen_sg = build(w, st, E('εως','L','sh'));
      out.dat_sg = build(w, st, E('ει','L'));
      out.nom_pl = out.voc_pl = out.ac_pl = build(w, st, E('εις','L'));
      out.gen_pl = build(w, st, E('εων','L','sh'));
      out.dat_pl = build(w, st, E('εσι','S'));
    }
    if(d==='u'||d==='uN'){
      out.gen_sg = build(w, st, E('εως','L','sh'));
      out.dat_sg = build(w, st, E('ει','L'));
      out.gen_pl = build(w, st, E('εων','L','sh'));
      out.dat_pl = build(w, st, E('εσι','S'));
      if(d==='u'){ out.nom_pl=out.voc_pl=out.ac_pl=build(w,st,E('εις','L'));
        out.voc_sg=w.nomsg.replace(/ς$/,''); out.ac_sg=build(w,st,E('υν','S')); }
      else { out.nom_pl=out.voc_pl=out.ac_pl=build(w,st,E('η','L')); }
    }
    if(d==='sN'){
      out.gen_sg = build(w, st, E('ους','L'));
      out.dat_sg = build(w, st, E('ει','L'));
      out.nom_pl = out.voc_pl = out.ac_pl = build(w, st, E('η','L'));
      out.gen_pl = build(w, st, E('ων','L','C1'));
      out.dat_pl = build(w, st, E('εσι','S'));
    }
    if(d==='sM'){
      out.ac_sg  = build(w, st, E('η','L'));
      out.gen_sg = build(w, st, E('ους','L'));
      out.dat_sg = build(w, st, E('ει','L'));
      out.voc_sg = build(w, st, E('ες','S'));
      delete out.nom_pl; delete out.voc_pl; delete out.ac_pl;
      delete out.gen_pl; delete out.dat_pl;
    }
    if(d==='eus'){
      var b = st.slice(0, st.length-1); /* sense la ε final */
      out.nom_sg = w.nomsg;
      out.voc_sg = putAccent(b+'ευ', 1, 'C');
      out.ac_sg  = build(w, st, E('α','S'));
      out.gen_sg = build(w, st, E('ως','L'));
      out.dat_sg = putAccent(b+'ει',1,'C');
      out.nom_pl = out.voc_pl = putAccent(b+'εις',1,'C');
      out.ac_pl  = build(w, st, E('ας','S'));
      out.gen_pl = build(w, st, E('ων','L'));
      out.dat_pl = putAccent(b+'ευσι',2,'C');
    }
  }
  if(sp.ex) for(var k2 in sp.ex) out[k2]=sp.ex[k2];
  return out;
}

   ============================================================ */
/* Parseja "n v a g d | n v a g d" -> {nom_sg:..., ...}   ('-' = no existeix) */
function T(str){
  var o={}, parts=str.trim().split('|');
  parts.forEach(function(p,pi){
    var n = pi===0?'sg':'pl';
    p.trim().split(/\s+/).forEach(function(x,i){ if(x!=='-') o[CASES[i]+'_'+n]=nfc(x); });
  });
  return o;
}
/* Aplica una taula de sufixos accentuats a una base sense accent */
function SUF(base, str){
  var o=T(str), r={};
  for(var k in o) r[k]= (o[k]==='' ? '' : nfc(base+o[k]));
  return r;
}

/* ---------------- ARTICLE ---------------- */
var ARTICLE = {
  m: T('ὁ - τόν τοῦ τῷ | οἱ - τούς τῶν τοῖς'),
  f: T('ἡ - τήν τῆς τῇ | αἱ - τάς τῶν ταῖς'),
  n: T('τό - τό τοῦ τῷ | τά - τά τῶν τοῖς')
};

/* ---------------- Tipus d'adjectius ---------------- */
/* 1a-2a de 3 terminacions: es genera amb la maquinària de substantius */
function femType(stem){
  var last = stem.slice(-1);
  return ('ειρ'.indexOf(bare(last))>=0) ? 'a_pura' : 'eta';
}

function mkAdj(sp){
  var a = {kind:'adj', l:sp.l, tr:sp.t, type:sp.d, tags:sp.tg||[], spec:sp, cmp:sp.cmp||null};
  a.decl = {};
  if(sp.d==='12'||sp.d==='2t'){
    var acc = readAccent(sp.l);
    var stem = unacc(sp.l).replace(/ος$/,'');
    var oxy = (acc.pos===1);
    var mkg = function(dtype, adjFem){
      var w = {kind:'noun', acc:{s:oxy?0:acc.s, m:acc.m}, q:{}, stem:stem,
               type:dtype, gender:'m', spec:{d:dtype}, adjFem:!!adjFem};
      if(acc.m==='C') w.q[acc.s-1]='L';
      if(sp.q) for(var k in sp.q) w.q[k-0]=sp.q[k];
      w.nomsg = null;
      return w;
    };
    var wm = mkg('o'); wm.nomsg = sp.l;
    a.decl.m = declineNoun(wm);
    var wn = mkg('on'); wn.gender='n'; wn.nomsg = build(wn, stem, ENDINGS.on.nom_sg);
    a.decl.n = declineNoun(wn);
    if(sp.d==='12'){
      var ft = femType(stem);
      var wf = mkg(ft, true); wf.gender='f';
      wf.nomsg = build(wf, stem, ENDINGS[ft].nom_sg);
      a.decl.f = declineNoun(wf);
    } else a.decl.f = a.decl.m;
  }
  else if(sp.d==='hand'){
    a.decl = {m:T(sp.m), f:T(sp.f||sp.m), n:T(sp.n)};
  }
  else if(sp.d==='suf'){
    a.decl = {m:SUF(sp.b,sp.m), f:SUF(sp.b,sp.f||sp.m), n:SUF(sp.b,sp.n)};
  }
  else if(sp.d==='hs3'){        /* ἀληθής, -ές */
    a.decl = { m:SUF(sp.b,'ής ές ῆ οῦς εῖ | εῖς εῖς εῖς ῶν έσι'),
               f:SUF(sp.b,'ής ές ῆ οῦς εῖ | εῖς εῖς εῖς ῶν έσι'),
               n:SUF(sp.b,'ές ές ές οῦς εῖ | ῆ ῆ ῆ ῶν έσι') };
    a.decl.f = a.decl.m;
  }
  else if(sp.d==='wn3'){        /* εὐδαίμων, -ον  /  comparatius μείζων, -ον */
    var accw = readAccent(sp.l);
    var stw = unacc(sp.l).replace(/ων$/,'ον');
    var mkw = function(g){
      return {kind:'noun', acc:{s:accw.s,m:accw.m}, q:{}, stem:stw, type:'n',
              gender:g, spec:{d:'n'}, nomsg:null};
    };
    var m = mkw('m'); m.nomsg = sp.l; a.decl.m = declineNoun(m);
    var n = mkw('n'); n.nomsg = sp.nn || putAccentRec(stw); a.decl.n = declineNoun(n);
    a.decl.f = a.decl.m;
    a.decl.m.voc_sg = sp.nn || putAccentRec(stw);
    a.decl.n.voc_sg = a.decl.n.nom_sg = a.decl.n.ac_sg = a.decl.m.voc_sg;
    if(sp.cmpAlt){
      a.alt = { ac_sg: sp.b2+'ω', nom_pl: sp.b2+'ους', ac_pl: sp.b2+'ους',
                nom_pl_n: sp.b2+'ω', ac_pl_n: sp.b2+'ω' };
    }
  }
  else if(sp.d==='contr'){      /* χρυσοῦς, -ῆ, -οῦν */
    var fem = sp.fa ? 'ᾶ ᾶ ᾶν ᾶς ᾷ | αῖ αῖ ᾶς ῶν αῖς'
                    : 'ῆ ῆ ῆν ῆς ῇ | αῖ αῖ ᾶς ῶν αῖς';
    a.decl = { m:SUF(sp.b,'οῦς οῦ οῦν οῦ ῷ | οῖ οῖ οῦς ῶν οῖς'),
               f:SUF(sp.b,fem),
               n:SUF(sp.b,'οῦν οῦν οῦν οῦ ῷ | ᾶ ᾶ ᾶ ῶν οῖς') };
  }
  return a;
}
function putAccentRec(w){
  var ns=nSyl(w), uq=qOf(w,1), pq=qOf(w,2);
  if(uq==='?')uq='S'; if(pq==='?')pq='S';
  var r=recessive(ns,uq,pq); return putAccent(w,r.pos,r.mark);
}

               '1pl':'1a plur.','2pl':'2a plur.','3pl':'3a plur.'};
var TENSE_CA = {pres:'present', impf:'imperfet', fut:'futur', aor:'aorist',
                pf:'perfet', plpf:'plusquamperfet', futp:'futur'};
var MOOD_CA  = {ind:'indicatiu', subj:'subjuntiu', opt:'optatiu', imper:'imperatiu',

/* quantitat sil·làbica automàtica d'una cadena; longV = vocals ambigües llargues */
function autoQ(s, longV){
  var ns = nuclei(letters(nfd(s))), out='';
  for(var i=0;i<ns.length;i++){
    var q = natQ(ns[i]);
    if(q==='?') q = (longV && longV.indexOf(ns[i].txt)>=0) ? 'L':'S';
    out += q;
  }
  return out;
}
/* Desinència: t=text, q=quantitats per síl·laba, a=regla d'accent */
function D(t,q,a){ return {t:t,q:q,a:a||'rec'}; }

/* munta una forma:  parts = [[text,quants],...]  */
function vbuild(parts, rule){
  var txt='', q='';
  parts.forEach(function(p){ txt+=p[0]; q+=p[1]; });
  var n = q.length;
  if(!n) return txt;
  var uq=q[n-1], pq=(n>1?q[n-2]:'S');
  var r;
  if(rule==='rec' || !rule) r = recessive(n, uq, pq);
  else if(rule==='ult:C') r = {pos:1, mark:'C'};
  else if(rule==='ult:A') r = {pos:1, mark:'A'};
  else if(rule==='pen:A') r = {pos:2, mark:'A'};
  else if(rule==='pen:C') r = {pos:2, mark:'C'};
  else if(rule==='pen:auto') r = {pos:2, mark:(uq==='S'&&pq==='L')?'C':'A'};
  else if(rule==='e1:C' || rule==='e1:A'){
    var endN = parts[parts.length-1][1].length;
    r = {pos: endN, mark: rule.slice(-1)};
  }
  else r = recessive(n, uq, pq);
  return putAccent(txt, r.pos, r.mark);
}

VE.th_imper_mid = {'2sg':D('ου','L','ult:C'),'3sg':D('εσθω','SL'),'2pl':D('εσθε','SS'),'3pl':D('εσθων','SL')};

/* ---------------- Participis ---------------- */
/* Construeix les tres declinacions d'un participi */
function mkPtcDecl(stemM, nomM, stemF, nomF, nomN, femType_, mType, qsM, qsF){
  function nw(st, nom, ty, g, qs){
    var a = readAccent(nom);
    var w = {kind:'noun', acc:{s:a.s,m:a.m}, q:{}, stem:st, type:ty, gender:g,
             spec:{d:ty}, nomsg:nom, qs:qs};
    if(a.m==='C') w.q[a.s-1]='L';
    return w;
  }
  mType = mType||'nt';
  var m = declineNoun(nw(stemM, nomM, mType, 'm', qsM));
  var n = declineNoun(nw(stemM, nomN, mType, 'n', qsM));
  var f = declineNoun(nw(stemF, nomF, femType_||'a_impura', 'f', qsF));
  n.nom_sg = n.voc_sg = n.ac_sg = nomN;
  m.voc_sg = nomM;
  return {m:m, f:f, n:n};
}
/* participi mitjà/passiu: adjectiu regular de 1a-2a */
function mkPtcMP(nomM){ return mkAdj({l:nomM, d:'12', t:''}).decl; }

function recV(b, suf, lv){
  var q = autoQ(b,lv)+autoQ(suf,'');
  var t = b+suf, n = q.length;
  if(suf==='ουσα') q = autoQ(b,lv)+'LS';
  if(suf==='ασα')  q = autoQ(b,lv)+'SS';
  if(suf==='ας')   q = autoQ(b,lv)+'L';
  n = q.length;
  var r = recessive(n, q[n-1], n>1?q[n-2]:'S');
  return putAccent(t, r.pos, r.mark);
}
/* participi actiu d'accent recessiu: el masculí fixa la síl·laba accentuada */
function recPtc(b, lv, sufMst, sufN, sufFst, sufF, sufM, femQ){
  var qb = autoQ(b, lv);
  var qsM = qb + 'S', qsF = qb + femQ;
  var nm = putAccentQ(b+sufM, qb+'L');
  var a  = readAccent(nm);
  var qN = qb + 'S';
  var nn = accAt(b+sufN, qN, a);
  var qF = qb + femQ + 'S';
  var nf = accAt(b+sufF, qF, a);
  return mkPtcDecl(b+sufMst, nm, b+sufFst, nf, nn, 'a_impura', 'nt', qsM, qsF);
}
function putAccentQ(t, q){
  var n=q.length, r=recessive(n, q[n-1], n>1?q[n-2]:'S');
  return putAccent(t, r.pos, r.mark);
}
function accAt(t, q, a){
  var n=q.length, r=resolveAccent(n, a.s, a.m, q[n-1], n>1?q[n-2]:'S');
  return putAccent(t, r.pos, r.mark);
}
var PTC_CLASS = {
  rec_ont: function(b,lv){ return recPtc(b,lv,'οντ','ον','ουσ','ουσα','ων','L'); },
  rec_ant: function(b,lv){ return recPtc(b,lv,'αντ','αν','ασ','ασα','ας','S'); },
  oxy_ont: function(b){ /* aorist temàtic actiu */
    return mkPtcDecl(b+'οντ', nfc(b+'ών'), b+'ουσ', nfc(b+'οῦσα'), nfc(b+'όν')); },
  eis:     function(b){ return mkPtcDecl(b+'εντ', nfc(b+'είς'), b+'εισ', nfc(b+'εῖσα'), nfc(b+'έν')); },
  ous:     function(b){ return mkPtcDecl(b+'οντ', nfc(b+'ούς'), b+'ουσ', nfc(b+'οῦσα'), nfc(b+'όν')); },
  as:      function(b){ var d = mkPtcDecl(b+'αντ', nfc(b+'άς'), b+'ασ', nfc(b+'ᾶσα'), nfc(b+'άν'),
              'a_impura','nt', autoQ(b,'')+'S', autoQ(b,'')+'L');
            var dp = accAt(b+'ασι', autoQ(b,'')+'LS', readAccent(nfc(b+'άς')));
            d.m.dat_pl = d.n.dat_pl = dp; return d; },
  us:      function(b){ var d = mkPtcDecl(b+'υντ', nfc(b+'ύς'), b+'υσ', nfc(b+'ῦσα'), nfc(b+'ύν'),
              'a_impura','nt', autoQ(b,'')+'S', autoQ(b,'')+'L');
            var dp = accAt(b+'υσι', autoQ(b,'')+'LS', readAccent(nfc(b+'ύς')));
            d.m.dat_pl = d.n.dat_pl = dp; return d; },
  kos:     function(b){ return mkPtcDecl(b+'οτ', nfc(b+'ώς'), b+'υι', nfc(b+'υῖα'), nfc(b+'ός'), 'a_pura', 'dent'); },
  ctr_a:   function(b){ return mkPtcDecl(b+'ωντ', nfc(b+'ῶν'), b+'ωσ', nfc(b+'ῶσα'), nfc(b+'ῶν')); },
  ctr_eo:  function(b){ return mkPtcDecl(b+'ουντ', nfc(b+'ῶν'), b+'ουσ', nfc(b+'οῦσα'), nfc(b+'οῦν')); },
  wn:      function(b){ return mkPtcDecl(b+'οντ', nfc(b+'ών'), b+'ουσ', nfc(b+'οῦσα'), nfc(b+'όν')); }
};

/* ==== 21_conj.js ==== */
/* ============================================================
   21_conj.js — Contracció i conjugació
   ============================================================ */
var CONTR = {
  α:{'ω':'ω','ου':'ω','ο':'ω','ε':'α','ει':'ᾳ','ῃ':'ᾳ','η':'α','οι':'ῳ','ῳ':'ῳ','ῆ':'ᾶ'},
  ε:{'ω':'ω','ου':'ου','ο':'ου','ε':'ει','ει':'ει','η':'η','ῃ':'ῃ','οι':'οι','ᾳ':'ᾳ'},
  ο:{'ω':'ω','ου':'ου','ο':'ου','ε':'ου','ει':'οι','η':'ω','ῃ':'οι','οι':'οι','ῳ':'ῳ'}
};
/* text cru d'un nucli (amb els seus diacrítics) */
function nucText(L,n){ var s=''; for(var i=n.a;i<=n.b;i++) s+=L[i]; return nfc(s); }

/* Contreu base+V+ending. rule: 'rec' o regla fixa aplicada a la forma SENSE contraure */
function contractForm(base, V, endT, endQ, rule, baseQ){
  var un = base + V + endT;
  var L  = letters(nfd(un));
  var ns = nuclei(L);
  var q  = (baseQ!=null?baseQ:autoQ(base,'')) + 'S' + endQ;
  var nb = nuclei(letters(nfd(base))).length;      /* índex 0-based de la vocal temàtica */
  if(ns.length !== q.length) q = autoQ(un,'');
  var n1 = ns[nb], n2 = ns[nb+1];
  if(!n2) return {txt:nfc(un), ai:null};
  var t2 = nucText(L,n2);
  var res = CONTR[V][t2];
  if(res===undefined) return {txt:nfc(un), ai:null};
  /* accent sobre la forma sense contraure */
  var r;
  var nn=ns.length, uq=q[nn-1], pq=nn>1?q[nn-2]:'S';
  if(rule==='rec'||!rule) r = recessive(nn, uq, pq);
  else if(rule==='ult:C') r={pos:1,mark:'C'};
  else if(rule==='pen:A') r={pos:2,mark:'A'};
  else r = recessive(nn, uq, pq);
  var ai = nn - r.pos;                              /* índex 0-based del nucli accentuat */
  /* munta la forma contreta */
  var pre = L.slice(0, n1.a).join('');
  var post= L.slice(n2.b+1).join('');
  var out = nfd(pre + res + post);
  var newN = nuclei(letters(out)).length;
  var newAi, mark;
  if(ai < nb){ newAi = ai; mark = r.mark; }
  else if(ai === nb){ newAi = nb; mark = 'C'; }
  else if(ai === nb+1){ newAi = nb; mark = 'A'; }
  else { newAi = ai-1; mark = r.mark; }
  return {txt: putAccent(nfc(out), newN-newAi, mark)};
}

/* ---------------- Construcció del verb ---------------- */
function unaug(s, ex){
  if(ex) return ex;
  if(s==null) return null;
  var d = nfd(s);
  if(/^ἐ/.test(nfc(d))){
    var rest = nfc(letters(d).slice(1).join(''));
    if(rest && VOW.indexOf(bare(rest[0]))<0) return rest;
  }
  return null;
}
function augPf(st){
  var c = bare(nfc(st)[0]);
  return (VOW.indexOf(c)>=0) ? st : 'ἐ'+st;
}
function mkVerb(sp){
  var v = {kind:'verb', l:sp.l, tr:sp.t, tags:sp.tg||[], spec:sp,
           lv:sp.lv||'', pp:sp.pp, cls:sp.cls||'th'};
  var pp = sp.pp || {};
  var S = {};
  if(sp.full){ v.S=S; return v; }
  /* present */
  if(v.cls==='ctr_a'){ S.presBase = unacc(pp.pres).replace(/αω$/,''); S.V='α'; }
  else if(v.cls==='ctr_e'){ S.presBase = unacc(pp.pres).replace(/εω$/,''); S.V='ε'; }
  else if(v.cls==='ctr_o'){ S.presBase = unacc(pp.pres).replace(/οω$/,''); S.V='ο'; }
  else if(/ομαι$/.test(unacc(pp.pres))){ S.pres = unacc(pp.pres).replace(/ομαι$/,''); S.presDep=true; }
  else S.pres = unacc(pp.pres).replace(/ω$/,'');
  S.presAug = sp.aug ? sp.aug : ('ἐ' + (v.cls.indexOf('ctr')===0?S.presBase:S.pres));
  if(sp.impfAug) S.presAug = sp.impfAug;
  /* futur */
  if(pp.fut){
    var f = unacc(pp.fut);
    if(/οῦμαι$/.test(nfc(pp.fut))){ S.futBase = f.replace(/ουμαι$/,''); S.futCtr='ε'; S.futDep=true; }
    else if(/ῶ$/.test(nfc(pp.fut))){ S.futBase = f.replace(/ω$/,''); S.futCtr='ε'; }
    else if(/ομαι$/.test(f)){ S.fut = f.replace(/ομαι$/,''); S.futDep=true; }
    else S.fut = f.replace(/ω$/,'');
  }
  /* aorist */
  if(pp.aor){
    var a = unacc(pp.aor);
    if(/α$/.test(a) && !/ον$/.test(a)){ S.aorType='sig'; S.aorAug=a.replace(/α$/,''); }
    else if(/ον$/.test(a)){ S.aorType='th2'; S.aorAug=a.replace(/ον$/,''); }
    else if(/ομην$/.test(a)){ S.aorType='th2mid'; S.aorAug=a.replace(/ομην$/,''); }
    else if(/αμην$/.test(a)){ S.aorType='sigmid'; S.aorAug=a.replace(/αμην$/,''); }
    if(S.aorAug!=null) S.aor = sp.aorStem || unaug(S.aorAug) || S.aorAug;
  }
  if(pp.pf)   S.pf   = unacc(pp.pf).replace(/α$/,'');
  if(pp.pfmp) S.pfmp = unacc(pp.pfmp).replace(/μαι$/,'');
  if(pp.aorp){
    S.aorpAug = unacc(pp.aorp).replace(/ην$/,'');
    S.aorp = sp.aorpStem || unaug(S.aorpAug) || S.aorpAug;
  }
  if(sp.stems) for(var k in sp.stems) S[k]=sp.stems[k];
  v.S = S;
  return v;
}

/* ---------------- Conjugació ---------------- */
function fin(stem, tbl, lv, rule){
  var out={}, q0=autoQ(stem,lv);
  PERS.forEach(function(p,i){
    var e = tbl[i]; if(!e) return;
    out[p] = vbuild([[stem,q0],[e.t,e.q]], rule||e.a);
  });
  return out;
}
function finC(base,V,tbl,lv){
  var out={}, bq=autoQ(base,lv);
  PERS.forEach(function(p,i){
    var e=tbl[i]; if(!e) return;
    out[p] = contractForm(base,V,e.t,e.q,e.a,bq).txt;
  });
  return out;
}
function one(stem, e, lv){ return vbuild([[stem,autoQ(stem,lv)],[e.t,e.q]], e.a); }
function imper(stem, tbl, lv){
  var o={}; ['2sg','3sg','2pl','3pl'].forEach(function(k){
    if(tbl[k]) o[k]=vbuild([[stem,autoQ(stem,lv)],[tbl[k].t,tbl[k].q]], tbl[k].a); });
  return o;
}
function imperC(base,V,tbl,lv){
  var o={}, bq=autoQ(base,lv);
  ['2sg','3sg','2pl','3pl'].forEach(function(k){
    if(tbl[k]) o[k]=contractForm(base,V,tbl[k].t,tbl[k].q,tbl[k].a,bq).txt; });
  return o;
}

/* Infinitius i participis dels contractes (taules fixes) */
var CTR_EXTRA = {
  α:{inf_act:'ᾶν', inf_mp:'ᾶσθαι', ptc_act:'ctr_a', ptc_mp:'ώμενος',
     opt_act:['ῴην','ῴης','ῴη','ῷμεν','ῷτε','ῷεν'],
     opt_mp:['ῴμην','ῷο','ῷτο','ῴμεθα','ῷσθε','ῷντο']},
  ε:{inf_act:'εῖν', inf_mp:'εῖσθαι', ptc_act:'ctr_eo', ptc_mp:'ούμενος',
     opt_act:['οίην','οίης','οίη','οῖμεν','οῖτε','οῖεν'],
     opt_mp:['οίμην','οῖο','οῖτο','οίμεθα','οῖσθε','οῖντο']},
  ο:{inf_act:'οῦν', inf_mp:'οῦσθαι', ptc_act:'ctr_eo', ptc_mp:'ούμενος',
     opt_act:['οίην','οίης','οίη','οῖμεν','οῖτε','οῖεν'],
     opt_mp:['οίμην','οῖο','οῖτο','οίμεθα','οῖσθε','οῖντο']}
};
function ctrList(base, arr){ var o={}; PERS.forEach(function(p,i){ o[p]=nfc(base+arr[i]); }); return o; }

function conjugate(v){
  if(v.spec.full){ var FF=MIV[v.spec.full](); FF.__alt=FF.__alt||{}; return FF; }
  var S=v.S, lv=v.lv, F={}, ctr=(v.cls.indexOf('ctr')===0);
  var ALT={};
  function put(k,val){ if(val!=null && val!=='') F[k]=val; }
  function putSet(k,obj){ if(obj) for(var p in obj) put(k+'.'+p, obj[p]); }
  function putAlt(k,obj){ if(obj) for(var p in obj){ var kk=k+'.'+p;
    if(obj[p]&&obj[p]!==F[kk]){ (ALT[kk]=ALT[kk]||[]).push(obj[p]); } } }

  /* ---- PRESENT / IMPERFET ---- */
  if(ctr){
    var b=S.presBase, V=S.V, X=CTR_EXTRA[V];
    putSet('pres.ind.act', finC(b,V,VE.pres_ind_act,lv));
    putSet('pres.ind.mp',  finC(b,V,VE.pres_ind_mp,lv));
    putSet('pres.subj.act',finC(b,V,VE.subj_act,lv));
    putSet('pres.subj.mp', finC(b,V,VE.subj_mp,lv));
    putSet('pres.opt.act', ctrList(b,X.opt_act));
    putSet('pres.opt.mp',  ctrList(b,X.opt_mp));
    putSet('pres.imper.act',imperC(b,V,VE.imper_act,lv));
    putSet('pres.imper.mp', imperC(b,V,VE.imper_mp,lv));
    put('pres.inf.act', nfc(b+X.inf_act));
    put('pres.inf.mp',  nfc(b+X.inf_mp));
    F['pres.ptc.act'] = PTC_CLASS[X.ptc_act](b);
    F['pres.ptc.mp']  = mkPtcMP(nfc(b+X.ptc_mp));
    var ab = S.presAug;
    putSet('impf.ind.act', finC(ab,V,VE.impf_act,lv));
    putSet('impf.ind.mp',  finC(ab,V,VE.impf_mp,lv));
  } else if(S.pres){
    var p=S.pres;
    putSet('pres.ind.act', fin(p,VE.pres_ind_act,lv));
    putSet('pres.ind.mp',  fin(p,VE.pres_ind_mp,lv));
    putSet('pres.subj.act',fin(p,VE.subj_act,lv));
    putSet('pres.subj.mp', fin(p,VE.subj_mp,lv));
    putSet('pres.opt.act', fin(p,VE.opt_act,lv));
    putSet('pres.opt.mp',  fin(p,VE.opt_mp,lv));
    putSet('pres.imper.act',imper(p,VE.imper_act,lv));
    putSet('pres.imper.mp', imper(p,VE.imper_mp,lv));
    put('pres.inf.act', one(p,VE.inf_act,lv));
    put('pres.inf.mp',  one(p,VE.inf_mp,lv));
    if(!S.presDep) F['pres.ptc.act'] = PTC_CLASS.rec_ont(p,lv);
    F['pres.ptc.mp']  = mkPtcMP(recV(p,'ομενος',lv));
    putSet('impf.ind.act', fin(S.presAug,VE.impf_act,lv));
    putSet('impf.ind.mp',  fin(S.presAug,VE.impf_mp,lv));
  }

  /* ---- FUTUR ---- */
  if(S.fut || S.futBase){
    if(S.futCtr){
      var fb=S.futBase, XF=CTR_EXTRA['ε'];
      if(!S.futDep){
        putSet('fut.ind.act', finC(fb,'ε',VE.pres_ind_act,lv));
        putSet('fut.opt.act', ctrList(fb,XF.opt_act));
        put('fut.inf.act', nfc(fb+XF.inf_act));
        F['fut.ptc.act'] = PTC_CLASS.ctr_eo(fb);
      }
      putSet('fut.ind.mid', finC(fb,'ε',VE.pres_ind_mp,lv));
      putSet('fut.opt.mid', ctrList(fb,XF.opt_mp));
      put('fut.inf.mid', nfc(fb+XF.inf_mp));
      F['fut.ptc.mid'] = mkPtcMP(nfc(fb+XF.ptc_mp));
    } else {
      var f=S.fut;
      if(!S.futDep){
        putSet('fut.ind.act', fin(f,VE.pres_ind_act,lv));
        putSet('fut.opt.act', fin(f,VE.opt_act,lv));
        put('fut.inf.act', one(f,VE.inf_act,lv));
        F['fut.ptc.act'] = PTC_CLASS.rec_ont(f,lv);
      }
      putSet('fut.ind.mid', fin(f,VE.pres_ind_mp,lv));
      putSet('fut.opt.mid', fin(f,VE.opt_mp,lv));
      put('fut.inf.mid', one(f,VE.inf_mp,lv));
      F['fut.ptc.mid'] = mkPtcMP(recV(f,'ομενος',lv));
    }
  }

  /* ---- AORIST ---- */
  if(S.aorType==='sig'||S.aorType==='sigmid'){
    var A=S.aor, AA=S.aorAug;
    if(S.aorType==='sig'){
      putSet('aor.ind.act', fin(AA,VE.aor_ind_act,lv));
      putSet('aor.subj.act',fin(A,VE.subj_act,lv));
      putSet('aor.opt.act', fin(A,VE.aor_opt_act,lv));
      putAlt('aor.opt.act', fin(A,VE.aor_opt_act2,lv));
      putSet('aor.imper.act',imper(A,VE.aor_imper_act,lv));
      put('aor.inf.act', one(A,VE.aor_inf_act,lv));
      F['aor.ptc.act'] = PTC_CLASS.rec_ant(A,lv);
    }
    putSet('aor.ind.mid', fin(AA,VE.aor_ind_mid,lv));
    putSet('aor.subj.mid',fin(A,VE.subj_mp,lv));
    putSet('aor.opt.mid', fin(A,VE.aor_opt_mid,lv));
    putSet('aor.imper.mid',imper(A,VE.aor_imper_mid,lv));
    put('aor.inf.mid', one(A,VE.aor_inf_mid,lv));
    F['aor.ptc.mid'] = mkPtcMP(recV(A,'αμενος',lv));
  } else if(S.aorType==='th2'||S.aorType==='th2mid'){
    var B=S.aor, BA=S.aorAug;
    if(S.aorType==='th2'){
      putSet('aor.ind.act', fin(BA,VE.impf_act,lv));
      putSet('aor.subj.act',fin(B,VE.subj_act,lv));
      putSet('aor.opt.act', fin(B,VE.opt_act,lv));
      putSet('aor.imper.act',imper(B,VE.th_imper_act,lv));
      put('aor.inf.act', one(B,VE.th_inf_act,lv));
      F['aor.ptc.act'] = PTC_CLASS.oxy_ont(B);
    }
    putSet('aor.ind.mid', fin(BA,VE.impf_mp,lv));
    putSet('aor.subj.mid',fin(B,VE.subj_mp,lv));
    putSet('aor.opt.mid', fin(B,VE.opt_mp,lv));
    putSet('aor.imper.mid',imper(B,VE.th_imper_mid,lv));
    put('aor.inf.mid', one(B,VE.th_inf_mid,lv));
    F['aor.ptc.mid'] = mkPtcMP(nfc(B+'όμενος'));
  }

  /* ---- AORIST I FUTUR PASSIUS ---- */
  if(S.aorp){
    var P=S.aorp, PA=S.aorpAug;
    putSet('aor.ind.pass', fin(PA,VE.ap_ind,lv));
    putSet('aor.subj.pass',fin(P,VE.ap_subj,lv));
    putSet('aor.opt.pass', fin(P,VE.ap_opt,lv));
    putSet('aor.imper.pass',imper(P,VE.ap_imper,lv));
    put('aor.inf.pass', one(P,VE.ap_inf,lv));
    F['aor.ptc.pass'] = PTC_CLASS.eis(P);
    var FP = P+'ησ';
    putSet('fut.ind.pass', fin(FP,VE.pres_ind_mp,lv));
    putSet('fut.opt.pass', fin(FP,VE.opt_mp,lv));
    put('fut.inf.pass', one(FP,VE.inf_mp,lv));
    F['fut.ptc.pass'] = mkPtcMP(recV(FP,'ομενος',lv));
  }

  /* ---- PERFET I PLUSQUAMPERFET ---- */
  if(S.pf){
    putSet('pf.ind.act', fin(S.pf,VE.pf_ind_act,lv));
    put('pf.inf.act', one(S.pf,VE.pf_inf_act,lv));
    F['pf.ptc.act'] = PTC_CLASS.kos(S.pf);
    putSet('plpf.ind.act', fin(v.spec.plpf||augPf(S.pf), VE.plpf_act, lv));
  }
  if(S.pfmp){
    putSet('pf.ind.mp', fin(S.pfmp,VE.pf_ind_mp,lv));
    put('pf.inf.mp', one(S.pfmp,VE.pf_inf_mp,lv));
    F['pf.ptc.mp'] = mkPtcMP(nfc(putAccent(S.pfmp+'μενος',2,'A')));
    putSet('plpf.ind.mp', fin(v.spec.plpfmp||augPf(S.pfmp), VE.plpf_mp, lv));
  }
  if(v.spec.ex) for(var k in v.spec.ex) F[k]=v.spec.ex[k];
  if(v.spec.alt) for(var ka in v.spec.alt) (ALT[ka]=ALT[ka]||[]).push(v.spec.alt[ka]);
  F.__alt = ALT;
  if(v.spec.del) v.spec.del.forEach(function(k){
    Object.keys(F).forEach(function(kk){ if(kk.indexOf(k)===0) delete F[kk]; }); });
  return F;

function P6(F, key, str){
  var a = str.trim().split(/\s+/);
  PERS.forEach(function(p,i){ if(a[i] && a[i]!=='-') F[key+'.'+p]=nfc(a[i]); });
  return F;
}
function SP(o){ /* {clau:'a b c d e f'} o {clau:'forma'} */
  var F={};
  for(var k in o){
    var v=o[k];
    if(typeof v==='string' && v.indexOf(' ')>=0 && /\.(ind|subj|opt|imper)\./.test(k)) P6(F,k,v);
    else if(typeof v==='string' && /\.(ind|subj|opt)\./.test(k)) P6(F,k,v);
    else F[k]= (typeof v==='string'? nfc(v) : v);
  }
  return F;
}
function IMP(F, key, str){
  var a=str.trim().split(/\s+/), ks=['2sg','3sg','2pl','3pl'];
  a.forEach(function(x,i){ if(x!=='-') F[key+'.'+ks[i]]=nfc(x); });
  return F;
}

   ============================================================ */
var GEN_ORDER = ['m','f','n'];

function buildAll(){
  var items = [];
  NOUNS.forEach(function(sp){
    var w = mkNoun(sp);
    w.cat='noun'; w.forms = declineNoun(w); w.tags = sp.tg||[];
    w.enunciat = sp.l+', '+shortGen(sp)+' ('+sp.a+')';
    items.push(w);
  });
  ADJS.forEach(function(sp){
    var a = mkAdj(sp);
    a.cat='adj'; a.tags = sp.tg||[]; a.enunciat = sp.l;
    items.push(a);
  });
  Object.keys(PRON).forEach(function(k){
    var p = PRON[k]; p.cat='pron'; p.tags=p.tg||[]; p.enunciat=p.l; items.push(p); });
  Object.keys(NUM).forEach(function(k){
    var p = NUM[k]; p.cat='pron'; p.tags=p.tg||[]; p.enunciat=p.l; items.push(p); });
  VERBS.forEach(function(sp){
    var v = mkVerb(sp);
    v.cat='verb'; v.tags = sp.tg||[]; v.enunciat = enunciatVerb(sp);
    v.F = conjugate(v);
    if(sp.athem && ATHEM_AOR[sp.athem]) applyAthem(v.F, ATHEM_AOR[sp.athem]);
    if(sp.ex) for(var k in sp.ex) v.F[k]=nfc(sp.ex[k]);
    items.push(v);
  });
  return items;
}
var SHORT12 = {a_pura:1,a_impura:1,eta:1,hs:1,as:1,o:1,on:1};
function shortGen(sp){
  var g = nfc(sp.g||''); if(!g) return '';
  if(SHORT12[sp.d] && !sp.forms) return '-'+g.slice(-2);
  return g;
}
function enunciatVerb(sp){
  if(sp.en) return sp.en;
  if(sp.full) return sp.l;
  var pp=sp.pp, a=[pp.pres];
  ['fut','aor','pf','pfmp','aorp'].forEach(function(k){ if(pp[k]) a.push(pp[k]); });
  return a.join(', ');
}
function applyAthem(F, tb){
  Object.keys(F).forEach(function(k){ if(k.indexOf('aor.')===0 && k.indexOf('.act')>=0) delete F[k]; });
  P6(F,'aor.ind.act',tb.ind); P6(F,'aor.subj.act',tb.subj); P6(F,'aor.opt.act',tb.opt);
  IMP(F,'aor.imper.act',tb.imper); F['aor.inf.act']=nfc(tb.inf);
  if(tb.ptc){ var p=tb.ptc.split(':'); F['aor.ptc.act']=PTC_CLASS[p[0]](p[1]); }
}

/* --------- enumeració de formes d'un ítem --------- */
function enumForms(it){
  var out=[];
  function pushDecl(decl, prefix, extra){
    GEN_ORDER.forEach(function(g){
      if(!decl[g]) return;
      CASES.forEach(function(c){ NUMS.forEach(function(n){
        var f = decl[g][c+'_'+n];
        if(!f) return;
        var a = {cas:c, num:n, gen:g};
        if(extra) for(var k in extra) a[k]=extra[k];
        if(a.nogen){ delete a.nogen; delete a.gen; }
        out.push({form:f, an:a, kind:prefix});
      });});
    });
  }
  if(it.cat==='noun'){
    var gs = (it.gender==='mf') ? ['m','f'] : [it.gender];
    CASES.forEach(function(c){ NUMS.forEach(function(n){
      var f=it.forms[c+'_'+n]; if(!f) return;
      gs.forEach(function(gg){ out.push({form:f, an:{cas:c,num:n,gen:gg}, kind:'noun'}); });
    });});
  } else if(it.cat==='adj'){ pushDecl(it.decl,'adj'); }
  else if(it.cat==='pron'){ pushDecl(it.decl,'pron', it.single?{nogen:1}:null); }
  else if(it.cat==='verb'){
    Object.keys(it.F).forEach(function(k){
      if(k==='__alt') return;
      var v=it.F[k], p=k.split('.');
      if(p[1]==='ptc'){
        pushDecl(v,'ptc',{temps:p[0], veu:p[2], mode:'ptc'});
      } else if(p[1]==='inf'){
        out.push({form:v, an:{temps:p[0], veu:p[2], mode:'inf'}, kind:'inf'});
      } else {
        out.push({form:v, an:{temps:p[0], mode:p[1], veu:p[2], pers:p[3].slice(0,1),
                              num:p[3].slice(1)}, kind:'fin'});
      }
    });
    var alt = it.F.__alt||{};
    Object.keys(alt).forEach(function(k){
      var p=k.split('.');
      alt[k].forEach(function(v){
        out.push({form:v, an:{temps:p[0],mode:p[1],veu:p[2],pers:p[3].slice(0,1),
                  num:p[3].slice(1)}, kind:'fin', alt:true});
      });
    });
  }
  out.forEach(function(o,i){ o.item=it; o.tags=it.tags;
    o.id = (it.l||it.id)+'#'+(o.kind)+'#'+JSON.stringify(o.an); });
  return out;
}

function init(){
  ITEMS = buildAll();

  BYID = {};

  SECTIONS.forEach(function(s){

    s.byWord = {};
    s.recs.forEach(function(r){ (s.byWord[r.item.l||r.item.id] = s.byWord[r.item.l||r.item.id]||[]).push(r); });
    s.words = Object.keys(s.byWord);
  });

function qType(r){
  if(r.kind==='fin') return 'fin';
  if(r.kind==='inf') return 'inf';
  if(r.kind==='ptc') return 'ptc';
  return 'nom';
}
function passesFilter(r){
  var a=r.an;
  if(a.mode && !S.fmode[a.mode]) return false;
  if(a.veu){ var v=a.veu;
    if(v==='mp'){ if(!S.fveu.mid && !S.fveu.pass) return false; }
    else if(!S.fveu[v]) return false; }
  return true;
}
function buildPool(){
  var secs = SECTIONS.filter(function(s){ return S.sel[s.id]; });
  var pool = [];
  secs.forEach(function(s){
    var ws = s.words.map(function(w){
      var rs = s.byWord[w].filter(passesFilter);
      return rs.length? {w:w, rs:rs} : null;
    }).filter(Boolean);
    if(ws.length) pool.push({sec:s, ws:ws});
  });
  S.pool = pool;
  return pool;
}
function poolCount(){
  if(!S.pool) return 0;
  var n=0; S.pool.forEach(function(p){ p.ws.forEach(function(w){ n+=w.rs.length; }); });
  return n;
}
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

/* evita formes trivials en mode escriptura */
function trivial(r){
  if(r.item.cat==='noun' && r.an.cas==='nom' && r.an.num==='sg') return true;
  if(r.item.cat==='verb' && r.an.mode==='ind' && r.an.temps==='pres' &&
     r.an.pers==='1' && r.an.num==='sg' && r.an.veu!=='pass') return true;
  if((r.item.cat==='adj'||r.item.cat==='pron') && r.an.cas==='nom' &&
      r.an.num==='sg' && r.an.gen==='m') return true;
  return false;
}
function pick(mode){
  var wrongIds = Object.keys(S.wrong);
  if(wrongIds.length && Math.random()<0.32){
    var id = rnd(wrongIds);
    var cand = BYID[id];
    if(cand && inPool(cand) && !(mode==='write'&&trivial(cand))) return cand;
  }
  for(var i=0;i<40;i++){
    var p = rnd(S.pool); if(!p) return null;
    var w = rnd(p.ws);
    var r = rnd(w.rs);
    if(r.alt) continue;
    if(mode==='write' && trivial(r)) continue;
    if(S.lastQ && r.id===S.lastQ) continue;
    return r;
  }
  return S.pool.length? rnd(rnd(S.pool).ws).rs[0] : null;
}
function inPool(r){
  var ok=false;
  S.pool.forEach(function(p){ if(p.sec.t(r) && passesFilter(r)) ok=true; });
  return ok;
}
function secOf(r){
  for(var i=0;i<SECTIONS.length;i++) if(S.sel[SECTIONS[i].id] && SECTIONS[i].t(r)) return SECTIONS[i].id;
  return null;
}

/* ---------- descripcions ---------- */
function describe(an, cap){
  var p=[];
  if(an.mode==='inf'){ p.push('infinitiu '+DE(LBLS.temps[an.temps])); p.push(veuTxt(an.veu)); }
  else if(an.mode==='ptc'){
    p.push('participi '+DE(LBLS.temps[an.temps])+' '+veuTxt(an.veu));
    p.push(LBLS.cas[an.cas]+' '+LBLS.num[an.num]+' '+LBLS.gen[an.gen]);
  } else if(an.pers){
    p.push(LBLS.pers[an.pers]+' '+LBLS.num[an.num]);
    p.push(LBLS.temps[an.temps]+' '+DE(LBLS.mode[an.mode]));
    p.push(veuTxt(an.veu));
  } else {
    p.push(LBLS.cas[an.cas]+' '+LBLS.num[an.num]);
    if(an.gen) p.push(LBLS.gen[an.gen]);
  }
  var s=p.join(', ');
  return cap? s.charAt(0).toUpperCase()+s.slice(1) : s;
}
function DE(w){ return (/^[aeiouàèéíòóúïüh]/i.test(nfc(w))) ? "d'"+w : 'de '+w; }
function veuTxt(v){ return 'veu '+(LBLS.veu[v]||v); }

function neededRows(){
  var r=S.cur, t=qType(r);
  if(t==='nom') return (r.an.gen===undefined)?['cas','num']:['cas','num','gen'];
  var base=['temps','mode','veu'];
  var m=S.ans.mode;
  if(m==='ptc') return base.concat(['cas','num','gen']);
  if(m==='inf') return base;
  if(m) return base.concat(['pers','num']);
  return base;
}
function renderRows(){
  var rows=neededRows(), h='';
  var names={cas:'Cas',num:'Nombre',gen:'Gènere',pers:'Persona',temps:'Temps',mode:'Mode',veu:'Veu'};
  rows.forEach(function(k){
    h+='<div class="row"><div class="rn">'+names[k]+'</div><div class="rb">';
    ROWS[k].forEach(function(v){
      h+='<button class="opt'+(S.ans[k]===v?' on':'')+'" data-k="'+k+'" data-v="'+v+'">'+LBL[k][v]+'</button>';
    });
    h+='</div></div>';
  });
  el('rows').innerHTML=h;
  el('rows').querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      if(S.answered) return;
      var k=b.getAttribute('data-k'), v=b.getAttribute('data-v');
      S.ans[k] = (S.ans[k]===v ? null : v);
      if(k==='mode'){ delete S.ans.pers; if(v!=='ptc'){ delete S.ans.cas; delete S.ans.gen; } }
      renderRows();
    };
  });
}
/* totes les anàlisis vàlides d'aquesta forma (mateix tipus de pregunta) */
function validAnalyses(r){
  var t=qType(r), f=nfc(r.form);
  var list=(BYFORM[f]||[]).filter(function(x){ return qType(x)===t; });
  var out=[], seen={};
  list.forEach(function(x){
    var a=x.an, key;
    if(t==='nom') key=a.cas+a.num+a.gen;
    else if(t==='inf') key='inf'+a.temps+a.veu;
    else if(t==='ptc') key='ptc'+a.temps+a.veu+a.cas+a.num+a.gen;
    else key=a.temps+a.mode+a.veu+a.pers+a.num;
    if(!seen[key]){ seen[key]=1; out.push(x); }
  });
  return out;
}
function veuOK(given, real){
  if(real==='mp') return given==='mid'||given==='pass';
  return given===real;
}
function matchAn(ans, an, t){
  if(t==='nom') return ans.cas===an.cas && ans.num===an.num &&
                       ((an.gen===undefined) ? true : ans.gen===an.gen);
  if(t==='inf') return ans.mode==='inf' && ans.temps===an.temps && veuOK(ans.veu,an.veu);
  if(t==='ptc') return ans.mode==='ptc' && ans.temps===an.temps && veuOK(ans.veu,an.veu) &&
                       ans.cas===an.cas && ans.num===an.num && ans.gen===an.gen;
  return ans.mode===an.mode && ans.temps===an.temps && veuOK(ans.veu,an.veu) &&
         ans.pers===an.pers && ans.num===an.num;
}
function checkAnalyze(){
  if(S.answered) return;
  var need = neededRows();
  for(var i=0;i<need.length;i++) if(!S.ans[need[i]]){
    el('fb').innerHTML='<div class="warn">Falta seleccionar: '+
      {cas:'el cas',num:'el nombre',gen:'el gènere',pers:'la persona',temps:'el temps',
       mode:'el mode',veu:'la veu'}[need[i]]+'.</div>'; return; }
  var r=S.cur, t=qType(r), va=validAnalyses(r);
  var good = va.some(function(x){ return matchAn(S.ans, x.an, qType(x)); });
  finish(good, va);
}
function checkWrite(){
  if(S.answered) return;
  var v = el('inp').value.trim();
  if(!v){ el('fb').innerHTML='<div class="warn">Escriu la forma o polsa «No ho sé».</div>'; return; }
  revealWrite(v);
}
function targets(r){
  var out=[nfc(r.form)], t=qType(r);
  (ALLF||[]).forEach(function(x){
    if(x.item!==r.item) return;
    if(qType(x)!==t) return;
    if(!matchAn2(x.an,r.an,t)) return;
    if(out.indexOf(nfc(x.form))<0) out.push(nfc(x.form));
  });
  return out;
}
function matchAn2(a,b,t){
  if(t==='nom') return a.cas===b.cas&&a.num===b.num&&a.gen===b.gen;
  if(t==='inf') return a.temps===b.temps&&a.veu===b.veu;
  if(t==='ptc') return a.temps===b.temps&&a.veu===b.veu&&a.cas===b.cas&&a.num===b.num&&a.gen===b.gen;
  return a.temps===b.temps&&a.mode===b.mode&&a.veu===b.veu&&a.pers===b.pers&&a.num===b.num;
}
function revealWrite(v){
  var tg = targets(S.cur);
  var good = v!=null && tg.some(function(x){ return bare(x)===bare(v); });
  finish(good, null, tg, v);
}
function finish(good, va, tg, typed){
  S.answered=true; S.done++;
  var sid = secOf(S.cur);
  if(sid){ S.stats[sid]=S.stats[sid]||{ok:0,ko:0}; S.stats[sid][good?'ok':'ko']++; }
  if(good){ S.ok++; S.streak++; if(S.streak>S.best) S.best=S.streak;
    if(S.wrong[S.cur.id]){ S.wrong[S.cur.id]--; if(S.wrong[S.cur.id]<=0) delete S.wrong[S.cur.id]; }
  } else { S.ko++; S.streak=0; S.wrong[S.cur.id]=(S.wrong[S.cur.id]||0)+2; }
  save();
  var it=S.cur.item, h='';
  h += '<div class="fb '+(good?'good':'bad')+'">'+(good?'Correcte':'Incorrecte')+'</div>';
  if(S.curMode==='write'){
    if(typed) h+='<div class="line">Has escrit: <b class="gr">'+esc(typed)+'</b></div>';
    h += '<div class="line">Forma correcta: <b class="gr">'+tg.map(esc).join('</b> / <b class="gr">')+'</b></div>';
  } else {
    var an=S.cur.an;
    h += '<div class="line">'+esc(describe(an,true))+
         (an.veu==='mp'?' <span class="note">(la mateixa forma per a la mitjana i la passiva)</span>':'')+'</div>';
    var others = va.filter(function(x){ return x.an!==an; });
    if(others.length){
      h += '<div class="line note">Aquesta forma també pot ser: '+
        others.map(function(x){ return esc(describe(x.an))+
          (x.item!==it?' <i>('+esc(x.item.l)+')</i>':''); }).join(' · ')+'</div>';
    }
    h += '<div class="line">De <b class="gr">'+esc(it.enunciat||it.l)+'</b> — '+esc(it.tr||it.t||'')+'</div>';
  }
  h += '<div class="acts"><button id="next" class="primary">Següent</button>'+
       '<button id="tbl" class="link">Vore la taula</button></div><div id="tblbox"></div>';
  el('fb').innerHTML=h;
  el('next').onclick=function(){ closeKB(); nextQ(); };
  el('tbl').onclick=function(){
    var box=el('tblbox');
    if(box.innerHTML){ box.innerHTML=''; el('tbl').textContent='Vore la taula'; }
    else { box.innerHTML=paradigmHTML(S.cur); el('tbl').textContent='Amagar la taula';
           box.scrollIntoView({block:'nearest',behavior:'smooth'}); } };
  var c=el('chk'); if(c) c.disabled=true;
  var s=el('skip'); if(s) s.disabled=true;
  el('bar').innerHTML = '<span class="ok">✓ '+S.ok+'</span><span class="ko">✗ '+S.ko+'</span>'+
    '<span class="st">ratxa '+S.streak+'</span><span class="st">rècord '+S.best+'</span>';
  document.addEventListener('keydown', enterNext);
}
function enterNext(e){
  if(e.key==='Enter' && S.answered){
    document.removeEventListener('keydown', enterNext);
    closeKB(); nextQ();
  }
}

/* ---------- teclat grec ---------- */
var KBROWS = [
 ['α','β','γ','δ','ε','ζ','η','θ'],
 ['ι','κ','λ','μ','ν','ξ','ο','π'],
 ['ρ','σ','ς','τ','υ','φ','χ','ψ'],
 ['ω','ͅ','⌫','✕']
];
var BETA = {a:'α',b:'β',g:'γ',d:'δ',e:'ε',z:'ζ',h:'η',q:'θ',i:'ι',k:'κ',l:'λ',m:'μ',
  n:'ν',c:'ξ',o:'ο',p:'π',r:'ρ',s:'σ',t:'τ',u:'υ',f:'φ',x:'χ',y:'ψ',w:'ω',j:'ς','|':'ͅ'};
function buildKB(){
  var h='';
  KBROWS.forEach(function(row){
    h+='<div class="kbr">';
    row.forEach(function(k){
      var cls='kbk', lab=k;
      if(k==='⌫'){ cls+=' wide del'; }
      else if(k==='✕'){ cls+=' wide close'; }
      else if(k==='ͅ'){ cls+=' wide iota'; lab='ᾳ ῃ ῳ'; }
      h+='<button class="'+cls+'" data-k="'+k+'">'+lab+'</button>';
    });
    h+='</div>';
  });
  el('kb').innerHTML=h;
  el('kb').querySelectorAll('.kbk').forEach(function(b){
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.onclick=function(){ kbPress(b.getAttribute('data-k')); };
  });
}
function kbPress(k){
  var inp=el('inp'); if(!inp) return;
  if(k==='✕'){ closeKB(); return; }
  var v=inp.value;
  if(k==='⌫'){ inp.value = trimLast(v); inp.focus(); return; }
  if(k==='ͅ'){ inp.value = addIota(v); inp.focus(); return; }
  inp.value = fixSigma(v + k);
  inp.focus();
}
function trimLast(v){
  var L = letters(nfd(v));
  L.pop();
  return nfc(L.join(''));
}
function addIota(v){
  var L = letters(nfd(v));
  if(!L.length) return v;
  var last = L[L.length-1], b = last[0].toLowerCase();
  if('αηω'.indexOf(b)<0 || last.indexOf(IOTA)>=0) return v;
  L[L.length-1] = last + IOTA;
  return nfc(L.join(''));
}
function fixSigma(v){
  v = v.replace(/ς/g,'σ');
  return v.replace(/σ$/,'ς');
}
function kbPhysical(e){
  if(e.key==='Enter'){ e.preventDefault(); if(S.answered){closeKB();nextQ();} else checkWrite(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); var i=el('inp'); i.value=trimLast(i.value); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var k=e.key;
  if(k.length!==1) return;
  var inp=el('inp');
  if(BETA[k.toLowerCase()] && !/[Ͱ-Ͽἀ-῿]/.test(k)){
    e.preventDefault();
    var g=BETA[k.toLowerCase()];
    if(g===IOTA) inp.value=addIota(inp.value);
    else inp.value=fixSigma(inp.value+g);
  } else if(/[Ͱ-Ͽἀ-῿]/.test(k)){
    e.preventDefault();
    inp.value=fixSigma(inp.value+k.toLowerCase());
  }
}
function openKB(){ el('kb').classList.add('open'); document.body.classList.add('kbon'); }
function closeKB(){ el('kb').classList.remove('open'); document.body.classList.remove('kbon'); }

/* ---------- estadístiques ---------- */
function renderStats(){
  var h='', tot={ok:0,ko:0};
  GROUPS.forEach(function(g){
    var secs=SECTIONS.filter(function(s){ return s.g===g && S.stats[s.id]; });
    if(!secs.length) return;
    h+='<h3>'+esc(g)+'</h3><table class="stt">';
    secs.forEach(function(s){
      var st=S.stats[s.id], n=st.ok+st.ko, pc=n?Math.round(100*st.ok/n):0;
      tot.ok+=st.ok; tot.ko+=st.ko;
      h+='<tr><td class="sn2">'+esc(s.n)+'</td><td class="num">'+st.ok+'/'+n+'</td>'+
         '<td class="barc"><span style="width:'+pc+'%" class="'+(pc>=80?'g':(pc>=50?'y':'r'))+'"></span></td>'+
         '<td class="num">'+pc+'%</td></tr>';
    });
    h+='</table>';
  });
  var n=tot.ok+tot.ko;
  el('statsbody').innerHTML = n ?
    ('<p class="tot">Total acumulat: <b>'+tot.ok+' de '+n+'</b> ('+Math.round(100*tot.ok/n)+
     '%) · rècord de ratxa: <b>'+S.best+'</b> · formes pendents de repàs: <b>'+
     Object.keys(S.wrong).length+'</b></p>'+h)
    : '<p class="tot">Encara no hi ha dades. Fes uns quants exercicis!</p>';
  show('stats');
}


/* ---------- taula del paradigma ---------- */
function paradigmHTML(r){
  var it=r.item, an=r.an, t=qType(r), h='';
  function cell(f, hi){ return '<td'+(hi?' class="hi"':'')+'>'+(f?esc(f):'—')+'</td>'; }
  if(t==='nom'||t==='ptc'){
    var decl;
    if(it.cat==='noun') decl=it.forms;
    else if(t==='ptc') decl=it.F[an.temps+'.ptc.'+an.veu][an.gen];
    else decl=it.decl[an.gen]||it.decl.m;
    if(!decl) return '';
    h+='<div class="tblwrap"><table class="par"><tr><th></th><th>singular</th><th>plural</th></tr>';
    CASES.forEach(function(c){
      h+='<tr><th>'+CASE_CA[c]+'</th>'+
         cell(decl[c+'_sg'], an.cas===c&&an.num==='sg')+
         cell(decl[c+'_pl'], an.cas===c&&an.num==='pl')+'</tr>';
    });
    h+='</table></div>';
    if(t==='ptc') h='<div class="note" style="margin-top:10px">'+
      esc(LBLS.temps[an.temps]+' · veu '+LBLS.veu[an.veu]+' · '+LBLS.gen[an.gen])+'</div>'+h;
  } else if(t==='fin'){
    var k=an.temps+'.'+an.mode+'.'+an.veu;
    h+='<div class="note" style="margin-top:10px">'+esc(LBLS.temps[an.temps]+' '+
       DE(LBLS.mode[an.mode])+', veu '+LBLS.veu[an.veu])+'</div>';
    h+='<div class="tblwrap"><table class="par"><tr><th></th><th>singular</th><th>plural</th></tr>';
    ['1','2','3'].forEach(function(pn){
      h+='<tr><th>'+LBLS.pers[pn]+'</th>'+
         cell(it.F[k+'.'+pn+'sg'], an.pers===pn&&an.num==='sg')+
         cell(it.F[k+'.'+pn+'pl'], an.pers===pn&&an.num==='pl')+'</tr>';
    });
    h+='</table></div>';
  } else {
    h+='<div class="tblwrap"><table class="par"><tr><th>infinitius</th><th>activa</th>'+
       '<th>mitjana</th><th>passiva</th></tr>';
    ['pres','fut','aor','pf'].forEach(function(tt){
      var a=it.F[tt+'.inf.act'], m=it.F[tt+'.inf.mid']||it.F[tt+'.inf.mp'], pa=it.F[tt+'.inf.pass'];
      if(!a&&!m&&!pa) return;
      h+='<tr><th>'+LBLS.temps[tt]+'</th>'+
         cell(a, an.temps===tt&&an.veu==='act')+
         cell(m, an.temps===tt&&(an.veu==='mid'||an.veu==='mp'))+
         cell(pa, an.temps===tt&&an.veu==='pass')+'</tr>';
    });
    h+='</table></div>';
  }
  return h;
}
